name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 0.2.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Manual trigger only: bump the version everywhere, commit, tag and push.
  # Pushing the v* tag kicks off the build matrix below. The push must use a
  # PAT (GH_PAT) because the default GITHUB_TOKEN cannot trigger tag workflows.
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Bump version everywhere
        run: bun scripts/bump-version.ts "${{ github.event.inputs.version }}"
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src/lib/version.ts
          git commit -m "chore(release): ${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin HEAD
          git push origin "v${{ github.event.inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  # Fires on the v* tag pushed by the bump job (or pushed manually). Builds
  # each platform natively on its own runner and publishes to a draft release.
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x86_64
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Export web bundle at webview root
        run: BASE_URL=/ bunx expo export -p web
      - name: Set up Rust toolchain (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build and publish release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bcp ${{ github.ref_name }}"
          releaseDraft: true
          releaseBody: "Latest build of bcp for ${{ matrix.platform }}."
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
      - name: Assemble rootless Linux tarball
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh
      - name: Upload Linux tarball to release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bcp-linux-${{ matrix.arch }}.tar.gz
