name: Release

on:
  push:
    tags:
      - "v*"

env:
  # tauri-action needs the token as an env var to create the release; the
  # ambient github.token alone is not enough for it.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Version bumps, changelog regeneration and tagging are done by the release
  # author before the v* tag is pushed (see CONTRIBUTING.md); CI never commits.
  # Pushing the tag builds each platform natively on its own runner and
  # publishes the GitHub Release from RELEASE.md.
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x86_64
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Export web bundle at webview root
        env:
          BASE_URL: /
        run: bunx expo export -p web
      - name: Set up Rust toolchain (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Read release notes
        # Windows runners default to PowerShell, which cannot run the bash
        # heredoc below; bash is present on every runner via Git for Windows.
        shell: bash
        run: |
          {
            echo 'RELEASE_BODY<<EOF'
            cat RELEASE.md
            # RELEASE.md is not guaranteed to end in a newline; without this
            # separator the EOF terminator would be glued to the last line and
            # the file command would fail to find its closing delimiter.
            if [ -n "$(tail -c 1 RELEASE.md)" ]; then echo; fi
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - name: Build and publish release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bcp ${{ github.ref_name }}"
          releaseDraft: true
          releaseBody: ${{ env.RELEASE_BODY }}
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
      - name: Assemble rootless Linux tarball
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh
      - name: Upload Linux tarball to release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bcp-linux-${{ matrix.arch }}.tar.gz

  # Gate after the matrix publishes: every artifact the desktop updater will
  # consume (latest.json, per-platform installers, signatures) must exist and
  # agree with the tag.
  validate:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verify version declarations are in sync
        run: bun run check:sync
      - name: Verify the changelog matches the release
        run: bun run check:changelog --release
      - name: Verify release artifacts and latest.json
        run: bun run check:release "${{ github.ref_name }}"
