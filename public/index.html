<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- pwa headers for the GitHub Pages deployment. Static, so browsers read
         the manifest at parse time and treat the site as installable. Relative
         hrefs keep the same bundle working under any base URL. -->
    <meta name="theme-color" id="theme-color" content="#e0dbd0" />
    <script>
      // paint the os chrome (status + nav bars) for the saved theme before the
      // bundle hydrates: on android chrome the runtime theme-color update in
      // ThemeContext already tints both bars, this just avoids the light-flash
      // first paint when the app is set to dark. colors mirror the palettes.
      (() => {
        var meta;
        var mode;
        try {
          meta = document.querySelector(
            'meta[name="theme-color"][id="theme-color"]',
          );
          if (!meta) return;
          mode = localStorage.getItem("bcp-theme-mode");
          if (mode !== "light" && mode !== "dark") {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          meta.content = mode === "dark" ? "#1b191a" : "#e0dbd0";
        } catch {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- high-res png keeps the trinity inside each cross arm from the very
         first paint and in firefox's installed-app fallback (which installs
         from this link rather than the manifest). the ico below is only a
         legacy favicon for old servers/crawlers. -->
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- register the service worker statically instead of from the bundle so it
         is in place before first paint and survives bundle errors. the desktop
         shell never registers it: on macos/linux tauri serves a non-http scheme,
         and on windows http://tauri.localhost matches the guard below, so the
         internals check keeps the shell out and the embedded bundle remains the
         only content the webview can render. -->
    <script>
      if (
        !window.__TAURI_INTERNALS__ &&
        window.location.protocol.startsWith("http") &&
        "serviceWorker" in navigator
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
