[package]
name = "bcp"
version = "0.1.0"
description = "Daily Office reader for the 1979 Book of Common Prayer"
edition = "2021"

# the static web export is embedded into the binary via tauri's asset
# protocol; no server, no runtime network dependency
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
