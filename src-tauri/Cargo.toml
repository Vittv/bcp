[package]
name = "bcp"
version = "0.4.0"
description = "Daily Office reader for the 1979 Book of Common Prayer"
edition = "2021"

# the static web export is embedded into the binary via tauri's asset
# protocol; no server, no runtime network dependency
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# reads the platform font database for the typography picker's system group.
# the webview cannot list installed fonts on webkitgtk or wkwebview, so the
# shell does it. fontconfig and memmap stay off: the standard font directories
# are scanned directly, so no extra native build dependency is needed.
fontdb = { version = "0.24", default-features = false, features = ["std", "fs"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
